name: Suite tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        host: [locked]
        include:
          # One extra Linux job proves the suite against the current Pi release.
          - os: ubuntu-latest
            host: "1.4.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - name: Upgrade the host under test
        if: matrix.host != 'locked'
        run: npm install --no-save --package-lock=false --no-audit --no-fund @earendil-works/pi-coding-agent@${{ matrix.host }} @earendil-works/pi-tui@${{ matrix.host }} @earendil-works/pi-ai@${{ matrix.host }}
      - name: Select the host under test
        shell: bash
        run: |
          HOST="$(node -p 'require("node:path").resolve("node_modules").split(require("node:path").sep).join("/")')"
          echo "PI_WORKSPACE_HOST_MODULES=$HOST" >> "$GITHUB_ENV"
          echo "PI_ASK_HOST_MODULES=$HOST" >> "$GITHUB_ENV"
          echo "PI_FRAME_HOST_MODULES=$HOST" >> "$GITHUB_ENV"
          echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/pi-suite-ci" >> "$GITHUB_ENV"
      - name: Prepare Pi file-completion binary in isolated agent directory
        shell: bash
        run: |
          node --input-type=module -e 'import { ensureTool } from "./node_modules/@earendil-works/pi-coding-agent/dist/utils/tools-manager.js"; if (!await ensureTool("fd", s => console.log(s.message))) process.exit(1);'
      - name: Full pipeline (typecheck, Frame, Ask, Egregore, Tasks, harness, packed suite)
        run: npm test
      - run: npm run pack:check
